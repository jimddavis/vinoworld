name: Validate Bundle

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks_code   # bundle root is here, not repo root
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Debug auth env (temporary)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "HOST is set: ${DATABRICKS_HOST:+YES}"
          echo "HOST length: ${#DATABRICKS_HOST}"
          echo "TOKEN is set: ${DATABRICKS_TOKEN:+YES}"
          echo "TOKEN length: ${#DATABRICKS_TOKEN}"

      - name: Validate bundle (dev target)
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev
