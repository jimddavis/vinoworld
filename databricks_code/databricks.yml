bundle:
  name: vinoworld_bundle

workspace:
  host: https://dbc-d0f295f4-d028.cloud.databricks.com/
  profile: "Free"
  # Explicit root_path ensures each target deploys to its own isolated path.
  # ${bundle.target} resolves to dev / staging / prod at deploy time.
  # Required for mode: production; also prevents dev and staging from colliding.
  root_path: /Workspace/Users/zieder0022@gmail.com/.bundle/${bundle.name}/${bundle.target}

# ---------------------------------------------------------------------------
# Variables — resolved at deploy time; override per target below.
# shared_lib_path points to the libs/ folder deployed by the bundle.
# ---------------------------------------------------------------------------
variables:
  catalog:
    description: Unity Catalog name for this deployment target
    default: vinoworld
  shared_lib_path:
    description: Workspace path to the shared Python utility modules
    default: ${workspace.root_path}/files/libs
  managed_location:
    description: >
      ADLS abfss:// path for catalog MANAGED LOCATION (Azure only).
      Leave empty for Free Edition — omits the clause entirely.
    default: ""

resources:
  jobs:

    # -----------------------------------------------------------------------
    # Job 1: Environment Setup
    # Run once per environment before the pipeline job executes.
    # Creates the catalog, schemas, volumes, and all managed tables.
    # Safe to re-run — all DDL uses CREATE IF NOT EXISTS.
    # -----------------------------------------------------------------------
    vinoworld_environment_setup:
      name: Vinoworld_Environment_Setup (${bundle.target})
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
        - name: managed_location
          default: ${var.managed_location}
      tasks:
        - task_key: provision_catalog
          notebook_task:
            notebook_path: ./setup/catalog_ddl.ipynb

        - task_key: seed_volumes
          depends_on:
            - task_key: provision_catalog
          notebook_task:
            notebook_path: ./setup/seed_volumes.ipynb

      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED

    # -----------------------------------------------------------------------
    # Job 2: ELT Pipeline
    # Assumes the environment has already been provisioned by the setup job
    # and that source files have been staged in the appropriate Volumes.
    # -----------------------------------------------------------------------
    vinoworld_elt_pipeline:
      name: Vinoworld_ELT_Pipeline (${bundle.target})
      # Job parameters flow to all notebook tasks automatically as widget values.
      # Python script tasks receive values via sys.argv (see init_pipeline_log).
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
      tasks:
        - task_key: truncate_all_tables
          notebook_task:
            notebook_path: ./notebooks/001-Truncate_All_Tables.ipynb

        - task_key: init_pipeline_log
          depends_on:
            - task_key: truncate_all_tables
          spark_python_task:
            python_file: ./libs/init_pipeline_run_log.py
            parameters:
              - "${var.shared_lib_path}"
              - "${var.catalog}"
          environment_key: Default

        - task_key: move_datafiles_from_archive
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ./notebooks/000-MoveFilesFromArchiveToBronze.ipynb

        - task_key: brz_load_arancione_sales_files
          depends_on:
            - task_key: move_datafiles_from_archive
          notebook_task:
            notebook_path: ./notebooks/bronze/brz_01_arancione_sales.ipynb
          environment_key: Default

        - task_key: brz_load_celeste_sales_files
          depends_on:
            - task_key: move_datafiles_from_archive
          notebook_task:
            notebook_path: ./notebooks/bronze/brz_02_celeste_sales.ipynb
          environment_key: Default

        - task_key: brz_load_verde_sales_files
          depends_on:
            - task_key: move_datafiles_from_archive
          notebook_task:
            notebook_path: ./notebooks/bronze/brz_03_verde_sales.ipynb
          environment_key: Default

        - task_key: brz_load_product_files
          depends_on:
            - task_key: move_datafiles_from_archive
          notebook_task:
            notebook_path: ./notebooks/bronze/brz_04_products.ipynb
          environment_key: Default

        - task_key: load_dim_product
          depends_on:
            - task_key: brz_load_product_files
          notebook_task:
            notebook_path: ./notebooks/silver/slvr_02_load_dim_product.ipynb

        - task_key: load_dim_region
          depends_on:
            - task_key: brz_load_product_files
          notebook_task:
            notebook_path: ./notebooks/silver/slvr_03_load_dim_region.ipynb

        - task_key: load_dims_from_csv
          depends_on:
            - task_key: move_datafiles_from_archive
          notebook_task:
            notebook_path: ./notebooks/silver/slvr_01_load_dim_fromcsv.ipynb

        - task_key: load_silver_sales
          depends_on:
            - task_key: brz_load_arancione_sales_files
            - task_key: brz_load_celeste_sales_files
            - task_key: brz_load_verde_sales_files
            - task_key: load_dim_product
          notebook_task:
            notebook_path: ./notebooks/silver/slvr_04_load_sales.ipynb

        - task_key: load_gold_sales_fact
          depends_on:
            - task_key: load_silver_sales
            - task_key: load_dim_region
            - task_key: load_dims_from_csv
            - task_key: load_dim_product
          notebook_task:
            notebook_path: ./notebooks/gold/gold_01_load_sales_fact.ipynb

      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev_vinoworld

  staging:
    mode: development
    variables:
      catalog: staging_vinoworld

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/zieder0022@gmail.com/.bundle/${bundle.name}/${bundle.target}
    # catalog inherits default: vinoworld

  azure_prod:
    mode: production
    workspace:
      host: https://adb-7405612365242928.8.azuredatabricks.net/
      profile: Azure
      # ${workspace.current_user.userName} resolves to the authenticated user at deploy time.
      # Avoids hardcoding an email that may differ between Free Edition and Azure AD accounts.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # catalog inherits default: vinoworld — same name, separate Azure workspace
    variables:
      managed_location: "abfss://dbrks-vinoworld@stgvinworldjdd1.dfs.core.windows.net/managed_data"
